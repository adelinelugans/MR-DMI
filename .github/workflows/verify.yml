name: Deployment and OCR checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest test_engine test_identification test_api test_deployment
      - run: gunicorn --check-config app:app && gunicorn --check-config app:A
      - run: node test_identification.cjs && node test_mobile_ocr.cjs
